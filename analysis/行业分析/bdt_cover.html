<!DOCTYPE html><html><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1800px;height:766px;background:linear-gradient(160deg,#0f0f23 0%,#1a1a2e 40%,#16213e 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 320px;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;position:relative;overflow:hidden}
.c1{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(226,183,20,0.06) 0%,transparent 70%);top:-180px;right:-120px}
.c2{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(226,183,20,0.04) 0%,transparent 70%);bottom:-150px;left:-100px}
.tag{display:inline-block;font-size:26px;color:#e2b714;border:2px solid rgba(226,183,20,0.4);padding:10px 28px;border-radius:6px;letter-spacing:4px;margin-bottom:36px}
.title{font-size:72px;font-weight:900;color:#fff;text-align:center;line-height:1.3;letter-spacing:4px;text-shadow:0 2px 20px rgba(0,0,0,0.5)}
.line{width:160px;height:4px;background:linear-gradient(90deg,transparent,#e2b714,transparent);margin:28px auto}
.sub{font-size:36px;font-weight:400;color:#e2b714;text-align:center;letter-spacing:3px}
.meta{font-size:22px;color:#8899aa;text-align:center;margin-top:30px;letter-spacing:2px}
</style><body>
<div class="c1"></div><div class="c2"></div>
<div class="tag">浩哥 AI 分析</div>
<div class="title">半导体行业全景分析</div>
<div class="line"></div>
<div class="sub">从设计到制造 · 谁在赚钱谁在烧钱？</div>
</body></html>
