<!DOCTYPE html><html><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1800px;height:766px;background:linear-gradient(160deg,#0f0f23 0%,#1a1a2e 40%,#16213e 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 380px;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;position:relative;overflow:hidden}
.c1{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(226,183,20,0.06) 0%,transparent 70%);top:-150px;right:-100px}
.c2{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(226,183,20,0.04) 0%,transparent 70%);bottom:-120px;left:-80px}
.tag{display:inline-block;font-size:20px;color:#e2b714;border:1px solid rgba(226,183,20,0.4);padding:6px 20px;border-radius:4px;letter-spacing:3px;margin-bottom:28px}
.title{font-size:64px;font-weight:900;color:#fff;text-align:center;line-height:1.25;letter-spacing:4px;text-shadow:0 2px 20px rgba(0,0,0,0.5)}
.line{width:140px;height:3px;background:linear-gradient(90deg,transparent,#e2b714,transparent);margin:20px auto}
.sub{font-size:28px;font-weight:400;color:#e2b714;text-align:center;letter-spacing:3px}
.meta{font-size:15px;color:#8899aa;text-align:center;margin-top:24px;letter-spacing:2px}
.meta span{color:#e2b714}
.wm{position:absolute;bottom:30px;right:40px;font-size:14px;color:rgba(255,255,255,0.12);letter-spacing:3px}
</style><body>
<div class="c1"></div><div class="c2"></div>
<div class="tag">浩哥 AI 分析</div>

<div class="line"></div>
<div class="sub">利润涨38倍·PE从70跌到10倍·ROE从8%到26%</div>
<div class="meta"><span>601899</span> · 深度复盘</div>
<div class="wm">10-YEAR REVIEW</div>
</body></html>
