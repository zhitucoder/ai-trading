<!DOCTYPE html><html><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1800px;height:766px;background:linear-gradient(160deg,#0f0f23 0%,#1a1a2e 40%,#16213e 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:50px 260px;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;position:relative;overflow:hidden}
.c1{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(226,183,20,0.06) 0%,transparent 70%);top:-200px;right:-150px}
.c2{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(226,183,20,0.04) 0%,transparent 70%);bottom:-180px;left:-120px}
.tag{display:inline-block;font-size:30px;color:#e2b714;border:2px solid rgba(226,183,20,0.4);padding:12px 32px;border-radius:6px;letter-spacing:5px;margin-bottom:40px}
.title{font-size:100px;font-weight:900;color:#fff;text-align:center;line-height:1.2;letter-spacing:6px;text-shadow:0 2px 20px rgba(0,0,0,0.5)}
.line{width:200px;height:4px;background:linear-gradient(90deg,transparent,#e2b714,transparent);margin:32px auto}
.sub{font-size:40px;font-weight:400;color:#e2b714;text-align:center;letter-spacing:4px}
.meta{font-size:26px;color:#8899aa;text-align:center;margin-top:36px;letter-spacing:3px}
.meta span{color:#e2b714}
</style><body>
<div class="c1"></div><div class="c2"></div>
<div class="tag">浩哥 AI 分析</div>
<div class="title">英维克</div>
<div class="line"></div>
<div class="sub">营收增长32% · 现金流只有净利的30%</div>
<div class="meta"><span>002837</span> · 2025年报 + 2026Q1</div>
</body></html>
