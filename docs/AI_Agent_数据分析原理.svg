<style>
  text { font-family: -apple-system,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
  .ttl { font-family: Georgia,"Times New Roman",serif; font-size: 26px; font-weight: 700; fill: #ffffff; }
  .sub { font-size: 14px; fill: #c9bfb3; }
  .lbl { font-family: Georgia,"Times New Roman",serif; font-size: 15px; font-weight: 700; fill: #e8c49a; opacity: 1; }
  .nm { font-size: 17px; font-weight: 700; }
  .sm { font-size: 14px; fill: #e0d9cf; font-weight: 600; }
  .xs { font-size: 13px; fill: #e0d9cf; font-weight: 600; }
  .al { font-size: 12px; fill: #c4b6a5; font-weight: 600; }
  .fn { font-family: "Cascadia Code","SF Mono","Courier New",monospace; font-size: 13px; fill: #e8e2d9; font-weight: 700; }
</style>
